- id: privacy/cookie-before-consent
  category: privacy
  check: auto
  # 렌더링 전용 (--live). 처리방침과 상관없이 쿠키 동작을 보므로 depends_on을 걸지 않는다 (evidence-dsl.md 3.6)
  # L2: 사전 동의 의무 범위가 확인되지 않음 / I2: 과태료·신뢰 하락 / P3: 분석 툴을 넣으면 흔히 발생 (기획서 5.2 PRIV-06)
  factors: { L: 2, I: 2, P: 3 }
  trigger: analytics_scripts
  evidence:
    - falsy: cookies_before_consent
      mode: live
  message: 이용자가 동의하기 전에 추적 쿠키가 설정됩니다.
  fix: >-
    쿠키 배너에서 동의를 받은 뒤 분석 스크립트를 불러오세요 (예: Google 동의 모드, 동의 후 gtag 로드).
  principle:
    law: 개인정보 보호법
    article: TODO-확인필요
    source: null
    verified_at: null
    references:
      - candidate: 근거 확인 필요 (국내법상 쿠키 사전 동의 의무 여부, 해외 이용자 대상이면 GDPR·ePrivacy 지침)
        basis: 사용자 확인 필요 (2026-11-28)
