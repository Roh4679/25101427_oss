# 개인정보 의무 (docs/spec/evidence-dsl.md 4장)
# 조문은 사람이 law.go.kr 원문으로 확인하기 전까지 TODO-확인필요로 둔다 (evidence-dsl.md 9장).
# references는 2차 자료(개인정보보호위원회 안내, 법무법인 자료)에서 본 후보다. source가 아니다.
# 개인정보 보호법이 2026.3.10 개정(법률 제21445호, 2026.9.11 시행)되어 항·호 번호가 바뀌었을 수 있다.

- id: privacy/policy-page
  category: privacy
  check: auto
  # L3: 처리방침 공개는 조문에 명시된 의무 / I2: 과태료·신뢰 하락 / P3: 바이브코딩 앱에서 흔히 빠짐 (기획서 5.2 PRIV-01)
  factors: { L: 3, I: 2, P: 3 }
  trigger: collects_personal_info
  # 흔적: 처리방침 문구. "개인정보 수집·이용 동의" 같은 일반 문구는 흔적이 아니다
  trace: ["개인정보처리방침", "privacy policy"]
  evidence:
    - page_exists: { kind: privacy, match: ["privacy", "개인정보처리방침"] }
  message: 개인정보를 받는데 개인정보 처리방침 페이지나 링크가 보이지 않습니다.
  fix: >-
    개인정보 처리방침 페이지를 만들고 모든 페이지 하단(푸터)에 링크하세요.
    이미 노션 등 외부 페이지에 있다면 signoff.config.json의 pages.privacyPolicy에 주소를 지정하거나,
    직접 확인한 뒤 confirmations에 "privacy/policy-page": "pass"를 적으세요.
  principle:
    law: 개인정보 보호법
    article: TODO-확인필요
    source: null
    verified_at: null
    references:
      - candidate: 법 제30조, 시행령 제31조
        basis: 2차 자료 (개인정보보호위원회 안내, 법무법인 자료)
        note: 2026.3.10 개정(법률 제21445호, 2026.9.11 시행)으로 항·호 번호가 바뀌었을 수 있음

- id: privacy/policy-contents
  category: privacy
  check: semi
  # L3: 기재 항목이 법령에 명시 / I2: 과태료 / P2: 템플릿을 쓰면 대체로 들어 있음 (기획서 4.2 예시)
  factors: { L: 3, I: 2, P: 2 }
  trigger: collects_personal_info
  depends_on: privacy/policy-page
  parent_hint:
    - "수집 항목: {personal_forms.fields[kind!=other].kind}"
    - "분류되지 않은 항목: {personal_forms.fields[kind=other].label(name)} — 처리방침에 알맞은 이름으로 적으세요"
  evidence:
    - page_text_contains:
        page: { kind: privacy, match: ["privacy", "개인정보처리방침"] }
        all_of:
          - ["처리목적", "이용목적", "수집목적"]
          - ["수집하는개인정보항목", "처리하는개인정보항목", "수집항목", "개인정보의항목"]
          - ["보유기간", "보유및이용기간", "보유·이용기간", "이용기간"]
          - ["위탁"]
          - ["보호책임자"]
  message: 처리방침에 필수 항목(처리 목적, 수집 항목, 보유 기간, 위탁, 보호책임자) 중 보이지 않는 것이 있습니다.
  fix: >-
    처리방침에 빠진 항목을 추가하세요.
    직접 확인했다면 confirmations에 "privacy/policy-contents": "pass"를 적으세요.
  principle:
    law: 개인정보 보호법
    article: TODO-확인필요
    source: null
    verified_at: null
    references:
      - candidate: 법 제30조 제1항 각 호, 시행령 제31조 제1항 각 호
        basis: 2차 자료 (개인정보보호위원회 안내, 법무법인 자료)
        note: 2026.3.10 개정으로 항·호 번호가 바뀌었을 수 있음

- id: privacy/overseas-transfer
  category: privacy
  check: semi
  # L3: 국외 이전 고지는 조문에 명시 / I2: 과태료·분쟁 / P2: 해외 BaaS·AI API를 쓰는 앱에서 가끔 빠짐 (기획서 4.2 예시)
  factors: { L: 3, I: 2, P: 2 }
  trigger: { all: [collects_personal_info, overseas_services] }
  depends_on: privacy/policy-page
  parent_hint: "해외 서버로 이전될 수 있음: {overseas_services}"
  evidence:
    - page_text_contains:
        page: { kind: privacy, match: ["privacy", "개인정보처리방침"] }
        any_of: [["국외이전", "국외로이전", "해외이전", "국외로제공"]]
  message: 해외 서비스를 쓰는데 처리방침에 국외 이전 안내가 보이지 않습니다.
  fix: >-
    처리방침에 국외 이전 항목(이전받는 자, 국가, 항목, 시기·방법, 보유 기간)을 추가하세요.
    서비스 지역 설정에 따라 국내 서버만 쓴다면 직접 확인한 뒤 confirmations에 "privacy/overseas-transfer": "pass"를 적으세요.
  principle:
    law: 개인정보 보호법
    article: TODO-확인필요
    source: null
    verified_at: null
    references:
      - candidate: 법 제28조의8 (처리방침 공개는 시행령 제31조 제1항 제2호)
        basis: 2차 자료 (개인정보보호위원회 안내, 법무법인 자료)
        note: 2026.3.10 개정으로 항·호 번호가 바뀌었을 수 있음

- id: privacy/analytics-disclosure
  category: privacy
  check: auto
  # L3: 자동 수집 장치 기재는 조문에 명시 / I2: 과태료 / P2: GA를 넣고 처리방침은 그대로 두는 경우가 가끔 있음 (기획서 5.2 PRIV-02)
  factors: { L: 3, I: 2, P: 2 }
  trigger: analytics_scripts
  depends_on: privacy/policy-page
  parent_hint: "분석 도구: {analytics_scripts.vendor}"
  evidence:
    - page_text_contains:
        page: { kind: privacy, match: ["privacy", "개인정보처리방침"] }
        any_of:
          - ["google analytics", "구글애널리틱스", "meta pixel", "메타픽셀", "facebook pixel", "mixpanel", "카카오픽셀", "네이버애널리틱스", "분석도구", "자동수집장치", "행태정보"]
  message: 분석 도구를 쓰는데 처리방침에 분석 도구·자동 수집 장치 안내가 보이지 않습니다.
  fix: 처리방침에 사용하는 분석 도구 이름과 자동 수집 장치(쿠키 등)의 설치·운영 및 거부 방법을 추가하세요.
  principle:
    law: 개인정보 보호법
    article: TODO-확인필요
    source: null
    verified_at: null
    references:
      - candidate: 법 제30조 제1항 제7호 (자동 수집 장치)
        basis: 2차 자료 (개인정보보호위원회 안내, 법무법인 자료)
        note: 2026.3.10 개정으로 항·호 번호가 바뀌었을 수 있음

- id: privacy/embed-disclosure
  category: privacy
  check: auto
  # L2: 근거 조문이 불명확해 낮춤 (사용자 결정 2026-11-28) / I2: 신뢰 하락 / P2: 임베드를 쓰는 앱에서 가끔
  # 추적형 임베드를 privacy/analytics-disclosure에 합칠지 검토 중
  factors: { L: 2, I: 2, P: 2 }
  trigger: external_embeds
  depends_on: privacy/policy-page
  evidence:
    - page_text_contains:
        page: { kind: privacy, match: ["privacy", "개인정보처리방침"] }
        any_of: [["외부서비스", "제3자", "위탁", "임베드"]]
  message: 외부 임베드(동영상·지도·채팅 위젯 등)를 쓰는데 처리방침에 관련 안내가 보이지 않습니다.
  fix: 임베드한 외부 서비스가 이용자 정보를 수집하는지 확인하고, 수집한다면 처리방침에 적으세요.
  principle:
    law: 개인정보 보호법
    article: TODO-확인필요
    source: null
    verified_at: null
    references:
      - candidate: 근거 불명확 (제3자 제공·처리 위탁·자동 수집 장치 중 어느 것인지 확인 필요)
        basis: 사용자 검토 (2026-11-28)

- id: privacy/consent-checkbox
  category: privacy
  check: auto
  # L3: 동의를 받는 방법이 조문에 명시 / I2: 과태료·분쟁 / P3: 선택 동의 기본 체크가 흔함 (기획서 5.2 PRIV-04)
  factors: { L: 3, I: 2, P: 3 }
  trigger: collects_personal_info
  evidence:
    - every: { fact: personal_forms, field: consent.present }
    - none: { fact: personal_forms, field: consent.optional_prechecked }
  message: 개인정보 입력 폼에 동의 체크박스가 없거나, 선택 동의가 미리 체크되어 있습니다.
  fix: 필수·선택 동의를 나눠 체크박스를 두고, 선택 동의는 기본으로 체크하지 마세요 (defaultChecked, checked 제거).
  principle:
    law: 개인정보 보호법
    article: TODO-확인필요
    source: null
    verified_at: null
    references:
      - candidate: 법 제22조 제1항 (구분 동의), 제5항 (선택 동의 거부 시 서비스 거부 금지)
        basis: 2차 자료 (개인정보보호위원회 안내, 법무법인 자료)
        note: 항 번호 재확인 필요. 2026.3.10 개정으로 바뀌었을 수 있음

