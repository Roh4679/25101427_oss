# 서비스 대응표 (docs/spec/evidence-dsl.md 6장)

# 해외 서버로 이전될 수 있는 서비스. 지역 선택이 가능한 서비스가 있으므로 국가는 적지 않는다.
# 실제 이전 여부는 사용자가 확인한다. 패키지 이름은 npm에서 실제로 있는지 확인한 뒤 적는다 (확인일 2026-11-27).
services:
  - name: Supabase
    packages: ["@supabase/*"]
    hosts: ["*.supabase.co"]
    files: ["supabase/**"]
  - name: Firebase
    packages: ["firebase", "firebase-admin"]
    hosts: ["*.firebaseio.com", "firestore.googleapis.com"]
    files: ["firebase.json"]
  - name: OpenAI
    packages: ["openai"]
    hosts: ["api.openai.com"]
  - name: Anthropic
    packages: ["@anthropic-ai/sdk"]
    hosts: ["api.anthropic.com"]
  - name: Vercel
    packages: ["@vercel/*"]
    files: ["vercel.json"]

# 환경 변수 이름. 클라이언트 접두사(NEXT_PUBLIC_, VITE_ 등)를 뗀 이름이 같거나 "_이름"으로 끝나면 일치한다.
env_names:
  # 공개용으로 설계된 키: 클라이언트에 노출돼도 되므로 비밀값으로 보지 않는다
  public:
    - FIREBASE_API_KEY           # Firebase 웹 설정값 (보안은 Firebase 규칙이 담당)
    - FIREBASE_AUTH_DOMAIN
    - FIREBASE_PROJECT_ID
    - FIREBASE_STORAGE_BUCKET
    - FIREBASE_MESSAGING_SENDER_ID
    - FIREBASE_APP_ID
    - FIREBASE_MEASUREMENT_ID
    - SUPABASE_URL
    - SUPABASE_ANON_KEY          # 보안은 RLS가 담당
    - SUPABASE_PUBLISHABLE_KEY
    - STRIPE_PUBLISHABLE_KEY
    - GA_MEASUREMENT_ID
  # 공개되지만 허용 도메인(HTTP 리퍼러)·API 제한을 걸어야 하는 키: 확인 필요
  restricted:
    - GOOGLE_MAPS_API_KEY
    - GOOGLE_MAPS_KEY
    - MAPS_API_KEY
    - KAKAO_JS_KEY
    - KAKAO_JAVASCRIPT_KEY

# 동의 전 추적 쿠키로 볼 쿠키 이름 (privacy/cookie-before-consent). 각 서비스의 공개 안내에 나오는 이름만 적는다.
tracking_cookies:
  - _ga             # Google Analytics
  - _ga_*
  - _gid
  - _gat
  - _gat_*
  - _gcl_au         # Google Ads 전환
  - _fbp            # Meta Pixel
  - _fbc
  - mp_*_mixpanel   # Mixpanel
